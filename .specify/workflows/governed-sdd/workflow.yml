schema_version: "1.0"

workflow:
  id: "governed-sdd"
  name: "Governed Spec-Driven Development"
  version: "2.0.0"
  author: "SpecKitReference maintainers"
  description: "Discovery-first SDD with mandatory human gates, readiness review, and stable overlay anchors."
  integration: "auto"

requires:
  speckit_version: ">=0.0.0"
  integrations:
    any:
      - "codex"
      - "claude"
      - "gemini"
      - "copilot"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the substantive feature to discover and specify"
  feature_id:
    type: string
    required: true
    prompt: "Existing or reserved safe feature ID, for example 003-offline-mode"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; auto uses the initialized project integration"
  review_discovery:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  review_specification:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  review_plan_bundle:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  review_task_package:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  review_remediation:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  review_completion:
    type: string
    default: ""
    enum: ["", "approve", "reject"]

steps:
  - id: "discovery"
    command: "speckit.governance-discovery.discovery"
    integration: "{{ inputs.integration }}"
    input:
      args: "feature_id={{ inputs.feature_id }} {{ inputs.spec }}"

  - id: "review-discovery"
    type: "gate"
    message: "Review DISCOVERY. Before approving, record a hash-bound DISCOVERY approval through the governance manager for docs/spec-kit/features/{{ inputs.feature_id }}/DISCOVERY.md."
    options: ["approve", "reject"]
    verdict_input: "review_discovery"
    on_reject: "abort"

  - id: "specify"
    command: "speckit.specify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "clarify"
    command: "speckit.clarify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "review-specification"
    type: "gate"
    message: "Review the clarified SPECIFICATION. Before approving, record a hash-bound SPECIFICATION approval for the current spec.md through the governance manager."
    options: ["approve", "reject"]
    verdict_input: "review_specification"
    on_reject: "abort"

  - id: "plan"
    command: "speckit.plan"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "slot-security"
    type: "gate"
    message: "Reserved security slot. Review the project's configured security gate or explicitly record why it is not applicable. A project workflow overlay may replace or surround this stable anchor."
    options: ["approve", "reject"]
    on_reject: "abort"

  - id: "slot-design"
    type: "gate"
    message: "Reserved design slot. Review the project's configured design or accessibility gate or explicitly record why it is not applicable. A project workflow overlay may replace or surround this stable anchor."
    options: ["approve", "reject"]
    on_reject: "abort"

  - id: "slot-localization"
    type: "gate"
    message: "Reserved localization slot. Review the project's configured localization gate or explicitly record why it is not applicable. A project workflow overlay may replace or surround this stable anchor."
    options: ["approve", "reject"]
    on_reject: "abort"

  - id: "review-plan-bundle"
    type: "gate"
    message: "Review PLAN_BUNDLE: plan.md, research, data model, contracts, quickstart, and required slot outputs. Before approving, record a hash-bound PLAN_BUNDLE approval through the governance manager."
    options: ["approve", "reject"]
    verdict_input: "review_plan_bundle"
    on_reject: "abort"

  - id: "checklist"
    command: "speckit.checklist"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "tasks"
    command: "speckit.tasks"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "audit-task-readiness"
    command: "speckit.governance-discovery.task-readiness"
    integration: "{{ inputs.integration }}"
    input:
      args: "feature_id={{ inputs.feature_id }}"

  - id: "cold-start-review"
    command: "speckit.governance-discovery.cold-start-review"
    integration: "{{ inputs.integration }}"
    input:
      args: "feature_id={{ inputs.feature_id }}"

  - id: "review-task-package"
    type: "gate"
    message: "Review TASK_PACKAGE: tasks.md, readiness report, cold-start report, and traceability. Before approving, record a hash-bound TASK_PACKAGE approval through the governance manager."
    options: ["approve", "reject"]
    verdict_input: "review_task_package"
    on_reject: "abort"

  - id: "analyze"
    command: "speckit.analyze"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "review-remediation"
    type: "gate"
    message: "Review analyze output and any remediation. If artifacts changed, obtain the matching new hash-bound approval before continuing. If no remediation is required, approve with that evidence."
    options: ["approve", "reject"]
    verdict_input: "review_remediation"
    on_reject: "abort"

  - id: "implement"
    command: "speckit.implement"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "validate"
    command: "speckit.governance-discovery.validate"
    integration: "{{ inputs.integration }}"
    input:
      args: "feature_id={{ inputs.feature_id }}"

  - id: "converge"
    command: "speckit.converge"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "slot-release"
    type: "gate"
    message: "Reserved release slot. Review the project's configured release, deployment, or evidence gate. A project workflow overlay may replace or surround this stable anchor."
    options: ["approve", "reject"]
    on_reject: "abort"

  - id: "review-completion"
    type: "gate"
    message: "Review completion evidence, validation, convergence, residual risk, and release readiness. Approval records completion review; it does not silently authorize an external deployment."
    options: ["approve", "reject"]
    verdict_input: "review_completion"
    on_reject: "abort"
