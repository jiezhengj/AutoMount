schema_version: "1.0"

extension:
  id: "governance-discovery"
  name: "Governed Discovery and Readiness"
  version: "2.0.0"
  description: "Collect reviewable product requirements before SDD and enforce task-package readiness without altering upstream-owned artifacts."
  category: "governance"
  effect: "read-write"
  author: "SpecKitReference maintainers"
  license: "MIT"

requires:
  speckit_version: ">=0.0.0"

provides:
  commands:
    - name: "speckit.governance-discovery.discovery"
      file: "commands/speckit.governance.discovery.md"
      description: "Run the mandatory requirements-discovery protocol and request user approval of its snapshot."
    - name: "speckit.governance-discovery.task-readiness"
      file: "commands/speckit.governance.task-readiness.md"
      description: "Run the read-only task-package readiness audit before implementation."
    - name: "speckit.governance-discovery.cold-start-review"
      file: "commands/speckit.governance.cold-start-review.md"
      description: "Create the isolated cold-start task-review request and record only reviewer findings."
    - name: "speckit.governance-discovery.validate"
      file: "commands/speckit.governance.validate.md"
      description: "Run the feature validation protocol and report evidence without manufacturing approval."

tags:
  - "governance"
  - "discovery"
  - "readiness"
  - "review"
