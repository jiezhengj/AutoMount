schema_version: "1.0"

preset:
  id: "tiny-model-tasks"
  name: "Tiny-Model Task Contract"
  version: "2.0.0"
  description: "Wraps upstream task generation with a self-contained, auditable task-detail contract."
  author: "SpecKitReference maintainers"
  license: "MIT"

requires:
  speckit_version: ">=0.0.0"

provides:
  templates:
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Generate upstream-compatible tasks with the tiny-model detail contract."
      strategy: "wrap"

tags:
  - "tasks"
  - "tiny-model"
  - "governance"
